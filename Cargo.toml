[package]
name = "alpha-proxy"
version = "0.1.0"
edition = "2024"
authors = ["Abidbdwork"]
description = "High-performance modular proxy server with support for multiple protocols"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Networking
hyper = { version = "0.14", features = ["full"] }
tokio-rustls = "0.24"
rustls = "0.21"
socket2 = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Authentication
argon2 = "0.5"
jsonwebtoken = "8.3"

# Configuration
config = "0.13"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
bytes = "1.4"
parking_lot = "0.12"
rand = "0.8"
lazy_static = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[dev-dependencies]
tempfile = "3.8"
